# Publica la app en GitHub Pages (sitio público, sin credenciales de Firebase).
# URL resultante: https://herharold12-ship-it.github.io/cotiobra-cr/
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'cotiobra-cr/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cotiobra-cr/package-lock.json

      - name: Instalar dependencias
        run: npm --prefix cotiobra-cr ci

      - name: Compilar para GitHub Pages
        env:
          GITHUB_PAGES: 'true'
        run: npm --prefix cotiobra-cr run build

      - name: Respaldar rutas profundas como 404 (SPA)
        run: cp cotiobra-cr/dist/index.html cotiobra-cr/dist/404.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          # Habilita GitHub Pages (modo "GitHub Actions") si aún no está activo.
          enablement: true

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: cotiobra-cr/dist

  desplegar:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
